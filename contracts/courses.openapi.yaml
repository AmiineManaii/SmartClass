openapi: 3.1.0
info:
  title: SmartClass API — Generated Courses
  version: 0.1.0
  description: >
    Teacher-generated course library. A generation is saved as DRAFT
    (visible to its author and admins only); validating it (PUBLISHED)
    makes it readable by every authenticated user (students included).
    Courses built section-by-section carry their teacher-validated plan
    (`outline`) and cannot be published until every section is VALIDATED
    (409 SECTIONS_NOT_VALIDATED otherwise — see ai-assistant.openapi.yaml).
    TEACHER or ADMIN for writes, any authenticated user for published reads.
servers:
  - url: /api/v1
    description: SmartClass API v1 prefix
tags:
  - name: courses
    description: Generated course drafts, validation and reading
paths:
  /courses:
    post:
      operationId: saveCourse
      tags:
        - courses
      summary: Save a generated course as draft
      description: >
        Persists an AI-generated (or hand-written) Markdown course as DRAFT.
        Drafts are invisible to students until validated via `publishCourse`.
        TEACHER or ADMIN only.
      security:
        - bearerAuth: []
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - level
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Fonction Récursive en Python
                subject:
                  type: string
                  maxLength: 500
                  example: fonctions recursive en python
                content:
                  type: string
                  minLength: 1
                  maxLength: 500000
                  description: Course body in Markdown
                level:
                  type: string
                  enum: [concis, equilibre, detaille]
                difficulty:
                  type: string
                  enum: [facile, moyen, difficile]
                  default: moyen
                format:
                  type: string
                  enum: [resume, flashcards, carte-mentale]
                  default: resume
                classGroupIds:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
                  description: Class groups the course is assigned to (teacher-checked)
                outline:
                  type: object
                  description: >
                    Teacher-validated plan (from /ai/courses/generate-outline).
                    Persisting it arms the section-by-section build:
                    GET /ai/courses/{id}/build materializes one section per
                    entry (PENDING) on first open.
                  required:
                    - title
                    - sections
                  properties:
                    title:
                      type: string
                      minLength: 1
                      maxLength: 300
                    targetAudience:
                      type: string
                      maxLength: 300
                    prerequisites:
                      type: array
                      maxItems: 30
                      items:
                        type: string
                        maxLength: 300
                    description:
                      type: string
                      maxLength: 4000
                    sections:
                      type: array
                      minItems: 1
                      maxItems: 30
                      items:
                        type: object
                        required:
                          - title
                        properties:
                          id:
                            type: string
                            maxLength: 120
                            description: Stable section key (sec-1, …)
                          title:
                            type: string
                            minLength: 1
                            maxLength: 300
                          description:
                            type: string
                            maxLength: 4000
                          keyTopics:
                            type: array
                            maxItems: 40
                            items:
                              type: string
                              maxLength: 300
                          estimatedMinutes:
                            type: integer
                            minimum: 1
                            maximum: 600
              additionalProperties: false
      responses:
        '201':
          description: Saved draft (with Markdown body)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseDetail'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
  /courses/mine:
    get:
      operationId: listMyCourses
      tags:
        - courses
      summary: List my generated courses
      description: >
        Newest-first summaries (no Markdown body) authored by the caller,
        drafts and published mixed. TEACHER or ADMIN only.
      security:
        - bearerAuth: []
      x-status: implemented
      responses:
        '200':
          description: Own course summaries
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseSummary'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
  /courses/published:
    get:
      operationId: listPublishedCourses
      tags:
        - courses
      summary: List validated courses
      description: >
        Newest-first summaries of PUBLISHED courses (no Markdown body),
        readable by every authenticated user (students included).
      security:
        - bearerAuth: []
      x-status: implemented
      responses:
        '200':
          description: Published course summaries
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseSummary'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
  /courses/{id}:
    get:
      operationId: getCourse
      tags:
        - courses
      summary: Read one course
      description: >
        Full course with the Markdown body. Published courses are readable
        by every authenticated user; drafts only by their author or an
        admin (other callers get 404 so draft existence never leaks).
      security:
        - bearerAuth: []
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseDetail'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          description: Unknown course or draft of another author
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
    delete:
      operationId: deleteCourse
      tags:
        - courses
      summary: Delete a course
      description: >
        Deletes a draft or published course. Author or ADMIN only
        (strangers get 403). TEACHER or ADMIN only.
      security:
        - bearerAuth: []
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deletion receipt
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - deleted
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                        example: true
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          description: Unknown course
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
  /courses/{id}/publish:
    patch:
      operationId: publishCourse
      tags:
        - courses
      summary: Validate a draft
      description: >
        Moves a DRAFT to PUBLISHED so every authenticated user (students
        included) can read it. Author or ADMIN only. For courses built
        section-by-section, every section must be VALIDATED first:
        otherwise the request fails with 409 SECTIONS_NOT_VALIDATED
        (courses without sections publish as before). TEACHER or ADMIN only.
      security:
        - bearerAuth: []
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published course (with Markdown body)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseDetail'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          description: Unknown course
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: Not all sections are validated yet (section-by-section builds)
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SECTIONS_NOT_VALIDATED
                  message: All sections must be validated before publishing (2 sections left)
                  details:
                    - path: sections
                      message: 2 section(s) not validated
                  requestId: 9f84725e-38aa-4e12-b162-817346ac7901
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
  /courses/{id}/unpublish:
    patch:
      operationId: unpublishCourse
      tags:
        - courses
      summary: Return a course to draft
      description: >
        Moves a PUBLISHED course back to DRAFT (hidden from students
        again). Author or ADMIN only. TEACHER or ADMIN only.
      security:
        - bearerAuth: []
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Draft course (with Markdown body)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseDetail'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          description: Unknown course
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
  /courses/{id}/study:
    get:
      operationId: getCourseStudyWorkspace
      tags:
        - courses
      summary: Student study workspace for one course
      description: >
        Everything the student study screen needs in a single round-trip:
        the course chapters (used as summary/flashcard focus and citations),
        the caller's own generated artifacts, and their private tutor
        conversations. Drafts stay invisible to non-authors (404). Any
        authenticated reader of the course may call this endpoint; the
        payload only ever contains the CALLER's artifacts and threads.
      security:
        - bearerAuth: []
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Study workspace (caller-scoped artifacts and conversations)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseStudyWorkspace'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          description: Unknown course, draft of another author, or not enrolled in its class groups
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
  /courses/{id}/study/artifacts:
    post:
      operationId: generateCourseStudyArtifact
      tags:
        - courses
      summary: Generate a summary or a flashcard deck
      description: >
        Generates a study artifact strictly grounded in the published course
        content, using the local model router (STUDENT_SUMMARY /
        QUIZ_FLASHCARDS roles). When the local model is unavailable the
        service degrades to a deterministic extractive summary/deck, so the
        response is never empty. The artifact is persisted for the caller
        only. Rate-limited (10/minute per caller).
      security:
        - bearerAuth: []
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
              properties:
                kind:
                  type: string
                  enum: [SUMMARY, FLASHCARDS]
                language:
                  type: string
                  enum: [fr, en]
                  default: fr
                summaryMode:
                  type: string
                  enum: [short, medium, detailed, exam, eli15, bullet_points]
                  description: SUMMARY only (default medium)
                flashcardCount:
                  type: integer
                  minimum: 4
                  maximum: 20
                  description: FLASHCARDS only (default 8)
                focus:
                  type: string
                  maxLength: 200
                  description: Optional chapter title/keyword to focus the artifact on
              additionalProperties: false
      responses:
        '201':
          description: Generated artifact
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseStudyArtifact'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          description: Unknown course, draft of another author, or not enrolled in its class groups
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
  /courses/{id}/study/artifacts/{artifactId}:
    delete:
      operationId: deleteCourseStudyArtifact
      tags:
        - courses
      summary: Delete one of my study artifacts
      description: >
        Deletes an artifact owned by the caller. An artifact belonging to
        another student is not deleted (idempotent 204 — no ownership oracle).
      security:
        - bearerAuth: []
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Artifact deleted (or never owned by the caller)
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          description: Unknown course or not readable by the caller
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
  /courses/{id}/tutor/ask:
    post:
      operationId: askCourseTutor
      tags:
        - courses
      summary: Ask the course-scoped AI tutor
      description: >
        Answers a student question strictly from the selected published
        course (deterministic scope gate, then local RAG generation with
        citations). An OFF-COURSE question is refused: the reply carries
        `inScope: false` and a refusal message, and never reaches the local
        model. The conversation is private to the caller and reused when
        `conversationId` is supplied. Rate-limited (10/minute per caller).
      security:
        - bearerAuth: []
      x-status: implemented
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  minLength: 3
                  maxLength: 1000
                  example: Comment fonctionne une fonction récursive en Python ?
                conversationId:
                  type: string
                  format: uuid
                  description: Continue an existing thread (must belong to the caller and this course)
                language:
                  type: string
                  enum: [fr, en]
                  default: fr
              additionalProperties: false
      responses:
        '201':
          description: Exchange persisted (user message + assistant reply)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseTutorExchange'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          description: Unknown course, draft of another author, or not enrolled in its class groups
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '422':
          $ref: './common.yaml#/components/responses/ValidationError'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
components:
  parameters:
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
  schemas:
    CourseStudyChapter:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          example: p-1
        title:
          type: string
          example: Chapitre 1 — Introduction
    CourseSummaryContent:
      type: object
      required:
        - mode
        - markdown
        - keyTakeaways
        - sections
      properties:
        mode:
          type: string
          enum: [short, medium, detailed, exam, eli15, bullet_points]
        markdown:
          type: string
          description: Rendering-ready Markdown summary
        keyTakeaways:
          type: array
          maxItems: 8
          items:
            type: string
        sections:
          type: array
          items:
            type: object
            required:
              - title
              - excerpt
            properties:
              title:
                type: string
              excerpt:
                type: string
    CourseFlashcard:
      type: object
      required:
        - id
        - front
        - back
      properties:
        id:
          type: string
          example: fc-1
        front:
          type: string
        back:
          type: string
        sectionTitle:
          type:
            - string
            - 'null'
    CourseFlashcardsContent:
      type: object
      required:
        - focus
        - cards
      properties:
        focus:
          type: string
          example: all
        cards:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/CourseFlashcard'
    CourseStudyArtifact:
      type: object
      required:
        - id
        - courseId
        - userId
        - kind
        - title
        - language
        - config
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [SUMMARY, FLASHCARDS]
        title:
          type: string
        language:
          type: string
          enum: [fr, en, auto]
        config:
          type: object
          additionalProperties: true
        content:
          description: CourseSummaryContent for SUMMARY, CourseFlashcardsContent for FLASHCARDS
          oneOf:
            - $ref: '#/components/schemas/CourseSummaryContent'
            - $ref: '#/components/schemas/CourseFlashcardsContent'
        modelUsed:
          type:
            - string
            - 'null'
          description: Local model id, or `extractive-fallback` when the LLM was unavailable
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseTutorCitation:
      type: object
      required:
        - passageId
        - sectionTitle
        - excerpt
        - score
      properties:
        passageId:
          type: string
          example: p-2
        sectionTitle:
          type: string
        excerpt:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
    CourseTutorMessage:
      type: object
      required:
        - id
        - conversationId
        - role
        - content
        - citations
        - inScope
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CourseTutorCitation'
        inScope:
          type: boolean
          description: False when the question was outside the course and refused
        modelUsed:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    CourseTutorConversation:
      type: object
      required:
        - id
        - courseId
        - userId
        - title
        - messages
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CourseTutorMessage'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseTutorExchange:
      type: object
      required:
        - conversationId
        - userMessage
        - assistantMessage
      properties:
        conversationId:
          type: string
          format: uuid
        userMessage:
          $ref: '#/components/schemas/CourseTutorMessage'
        assistantMessage:
          $ref: '#/components/schemas/CourseTutorMessage'
    CourseStudyWorkspace:
      type: object
      required:
        - courseId
        - courseTitle
        - chapters
        - artifacts
        - conversations
      properties:
        courseId:
          type: string
          format: uuid
        courseTitle:
          type: string
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/CourseStudyChapter'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/CourseStudyArtifact'
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/CourseTutorConversation'
    CourseSummary:
      type: object
      required:
        - id
        - title
        - subject
        - level
        - difficulty
        - format
        - status
        - authorId
        - authorName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Fonction Récursive en Python
        subject:
          type:
            - string
            - 'null'
        level:
          type: string
          enum: [concis, equilibre, detaille]
        difficulty:
          type: string
          enum: [facile, moyen, difficile]
        format:
          type: string
          enum: [resume, flashcards, carte-mentale]
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        authorId:
          type: string
          format: uuid
        authorName:
          type: string
          example: Thomas Laurent
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/CourseSummary'
        - type: object
          required:
            - content
          properties:
            content:
              type: string
              description: Course body in Markdown
            outline:
              type:
                - object
                - 'null'
              description: Teacher-validated plan driving the section build (null for monolithic courses)
              properties:
                title:
                  type: string
                targetAudience:
                  type: string
                prerequisites:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      keyTopics:
                        type: array
                        items:
                          type: string
                      estimatedMinutes:
                        type: integer
