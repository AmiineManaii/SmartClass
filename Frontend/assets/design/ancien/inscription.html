<script>
  (function() {
    function setupToggle(buttonId, inputId) {
      const btn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener('click', function() {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        const icon = btn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        }
      });
    }
    setupToggle('pwd-toggle', 'pwd-field');
    setupToggle('pwd-confirm-toggle', 'pwd-confirm-field');

    const pwdField = document.getElementById('pwd-field');
    const pwdStrength = document.getElementById('pwd-strength');
    if (pwdField && pwdStrength) {
      pwdField.addEventListener('input', function(e) {
        const len = e.target.value.length;
        if (len === 0) {
          pwdStrength.style.width = '0%';
        } else if (len < 6) {
          pwdStrength.style.width = '33%';
        } else if (len < 10) {
          pwdStrength.style.width = '66%';
        } else {
          pwdStrength.style.width = '100%';
        }
      });
    }
  })();
