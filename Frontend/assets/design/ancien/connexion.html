  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><div class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface/80 backdrop-blur-xl pointer-events-none"><div class="h-11 px-margin flex items-center justify-between text-on-surface select-none"><span class="font-label-md text-label-md tracking-tight font-semibold">9:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[18px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[18px]">wifi</span><span class="material-symbols-outlined text-[20px]">battery_full</span></div></div></div><main class="flex-1 flex flex-col w-full bg-surface pt-11 pb-safe px-margin"><div class="flex flex-col w-full pb-8">
<!-- Brand Identity Header -->
<div class="flex flex-col items-center text-center mt-3 mb-8">
<div class="relative w-20 h-20 rounded-2xl bg-primary-container flex items-center justify-center shadow-lg shadow-primary-container/20 mb-4 transition-transform active:scale-95 duration-200">
<div class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-secondary-fixed flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="flex flex-col items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[38px] leading-none" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
</div>
<div class="flex items-center gap-1.5 mb-1">
<span class="font-headline-lg text-headline-lg tracking-tight text-primary font-bold">SmartClass</span>
</div>
<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-caption text-caption uppercase tracking-wider mb-3">
<span>EdTech</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span class="font-semibold text-secondary">AI Assisted</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-1.5">Bienvenue sur SmartClass</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Accédez à votre espace d'apprentissage intelligent</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-space-md w-full" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant px-0.5" for="email">Adresse e-mail</label>
<div class="relative flex items-center w-full bg-surface-container-lowest rounded-xl shadow-sm focus-within:shadow-md transition-all">
<div class="absolute left-3.5 flex items-center justify-center text-outline pointer-events-none transition-colors field-icon">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-12 bg-transparent text-on-surface font-body-md text-body-md pl-11 pr-4 rounded-xl placeholder:text-outline/60 focus:outline-none focus:bg-surface-container-low/40 transition-colors" id="email" name="email" placeholder="nom@exemple.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between px-0.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Mot de passe</label>
<button class="font-label-sm text-label-sm text-secondary hover:text-primary-container transition-colors" type="button">
          Mot de passe oublié ?
        </button>
</div>
<div class="relative flex items-center w-full bg-surface-container-lowest rounded-xl shadow-sm focus-within:shadow-md transition-all">
<div class="absolute left-3.5 flex items-center justify-center text-outline pointer-events-none transition-colors field-icon">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-12 bg-transparent text-on-surface font-body-md text-body-md pl-11 pr-11 rounded-xl placeholder:text-outline/60 focus:outline-none focus:bg-surface-container-low/40 tracking-wider transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Afficher ou masquer le mot de passe" class="absolute right-3 flex items-center justify-center text-outline hover:text-on-surface p-1 rounded-lg transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-2 w-full h-[50px] bg-primary-container hover:bg-primary active:scale-[0.98] text-on-primary font-label-md text-label-md rounded-xl shadow-md shadow-primary-container/25 flex items-center justify-center gap-2 transition-all cursor-pointer" id="submitBtn" type="submit">
<span id="btnText">Se connecter</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-6 gap-3">
<div class="flex-1 h-[1px] bg-surface-variant"></div>
<span class="font-caption text-caption text-on-surface-variant">ou continuer avec</span>
<div class="flex-1 h-[1px] bg-surface-variant"></div>
</div>
<!-- Social Authentication -->
<div class="grid grid-cols-2 gap-3 w-full">
<!-- Google Login -->
<button class="h-[50px] bg-surface-container-lowest active:scale-[0.98] shadow-sm hover:shadow-md rounded-xl flex items-center justify-center gap-2.5 transition-all text-on-surface font-label-md text-label-md cursor-pointer" type="button">
<svg class="w-5 h-5 shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
<!-- Microsoft Login -->
<button class="h-[50px] bg-surface-container-lowest active:scale-[0.98] shadow-sm hover:shadow-md rounded-xl flex items-center justify-center gap-2.5 transition-all text-on-surface font-label-md text-label-md cursor-pointer" type="button">
<svg class="w-5 h-5 shrink-0" viewbox="0 0 21 21">
<rect fill="#f25022" height="9" width="9" x="1" y="1"></rect>
<rect fill="#7fba00" height="9" width="9" x="11" y="1"></rect>
<rect fill="#00a4ef" height="9" width="9" x="1" y="11"></rect>
<rect fill="#ffb900" height="9" width="9" x="11" y="11"></rect>
</svg>
<span>Microsoft</span>
</button>
</div>
<!-- Sign Up Prompt -->
<div class="flex items-center justify-center gap-1.5 mt-8 text-center">
<span class="font-body-md text-body-md text-on-surface-variant">Pas encore de compte ?</span>
<button class="font-label-md text-label-md text-primary font-semibold hover:underline" type="button">
      S'inscrire
    </button>
</div>
</div>
<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Interactive submit micro-feedback
  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    if (!btn || !btnText) return;
    
    btn.classList.add('opacity-80', 'pointer-events-none');
    btnText.textContent = 'Connexion en cours...';

    setTimeout(() => {
      btn.classList.remove('opacity-80', 'pointer-events-none');
      btnText.textContent = 'Se connecter';
    }, 1200);
  }
</script></main><div class="fixed bottom-0 inset-x-0 z-50 pb-safe pointer-events-none flex justify-center"><div class="w-32 h-1 bg-on-surface/20 rounded-full mb-2"></div></div></body></html>
