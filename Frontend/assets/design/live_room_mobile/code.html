<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>SmartClass — Salle de Cours en Direct (Mobile)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#122675",
            "primary-container": "#2D3E8C",
            "on-primary": "#FFFFFF",
            secondary: "#4056B9",
            surface: "#0B0F19",
            "surface-container": "#151B2B",
            "surface-container-high": "#1E2638",
            "on-surface": "#F1F5F9",
            outline: "#475569",
            "outline-variant": "#334155",
            error: "#DC2626",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #000000; color: #F1F5F9; }
    .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-slate-950">

  <!-- MOBILE DEVICE FRAME (390px x 844px) -->
  <div class="w-full max-w-[400px] h-[844px] bg-surface rounded-none md:rounded-[44px] overflow-hidden shadow-2xl flex flex-col relative border-0 md:border-8 md:border-slate-800">

    <!-- TOP SAFE AREA / NOTCH SIMULATION -->
    <div class="h-11 px-6 flex items-center justify-between text-xs text-slate-400 z-30 select-none">
      <span class="font-semibold text-white">14:35</span>
      <div class="flex items-center gap-1.5">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-base text-white">battery_full</span>
      </div>
    </div>

    <!-- MOBILE SESSION HEADER -->
    <header class="px-4 py-2 flex items-center justify-between z-20 bg-surface/80 backdrop-blur-md">
      <div class="flex items-center gap-2">
        <button class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-slate-300">
          <span class="material-symbols-outlined text-base">expand_more</span>
        </button>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-red-500 pulse-dot"></span>
            <span class="text-[11px] font-bold text-red-400">EN DIRECT</span>
            <span class="text-[10px] text-slate-400">00:34</span>
          </div>
          <h1 class="text-xs font-bold text-white truncate max-w-[170px]">Algorithmique - Dijkstra</h1>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Switch Camera Button -->
        <button class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-slate-300 active:scale-95">
          <span class="material-symbols-outlined text-base">flip_camera_ios</span>
        </button>
        <!-- Audio Route Speaker -->
        <button class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-slate-300 active:scale-95">
          <span class="material-symbols-outlined text-base">volume_up</span>
        </button>
      </div>
    </header>

    <!-- MAIN HERO VIDEO CANVAS -->
    <div class="flex-1 px-3 py-2 flex flex-col gap-2.5 overflow-hidden relative">

      <!-- ACTIVE SPEAKER (HERO 16:9) -->
      <div class="w-full aspect-[4/3] rounded-2xl overflow-hidden bg-slate-900 border border-secondary/30 relative shadow-lg">
        <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?q=80&w=800&auto=format&fit=crop"
             alt="Active Speaker"
             class="w-full h-full object-cover"/>
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none"></div>

        <!-- Speaker Name Tag -->
        <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur text-xs text-white">
          <span class="material-symbols-outlined text-xs text-emerald-400 animate-pulse">mic</span>
          <span class="font-semibold text-[11px]">Prof. Alexandre Martin</span>
          <span class="px-1 py-0.2 rounded bg-primary text-[8px] font-bold uppercase">Hôte</span>
        </div>

        <!-- FLOATING PIP LOCAL CAMERA PREVIEW -->
        <div class="absolute top-2.5 right-2.5 w-20 h-28 rounded-xl overflow-hidden bg-surface-container-high border-2 border-white/20 shadow-xl">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop"
               alt="Local PiP"
               class="w-full h-full object-cover"/>
          <div class="absolute bottom-1 left-1 px-1 rounded bg-black/60 text-[9px] text-white">
            Vous
          </div>
        </div>
      </div>

      <!-- PARTICIPANTS SCROLL STRIP -->
      <div class="h-20 flex gap-2 overflow-x-auto pb-1">
        <!-- Student 1 -->
        <div class="w-28 h-full rounded-xl overflow-hidden bg-surface-container relative flex-shrink-0 border border-outline-variant">
          <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=200&auto=format&fit=crop"
               alt="Thomas B."
               class="w-full h-full object-cover"/>
          <div class="absolute top-1 right-1 px-1 rounded bg-amber-500 text-black font-bold text-[8px] flex items-center">
            <span class="material-symbols-outlined text-[10px]">front_hand</span>
          </div>
          <div class="absolute bottom-1 left-1 px-1 rounded bg-black/60 text-[9px] text-white">
            Thomas B.
          </div>
        </div>

        <!-- Student 2 (Audio only) -->
        <div class="w-28 h-full rounded-xl bg-surface-container relative flex-shrink-0 border border-outline-variant flex items-center justify-center">
          <div class="w-8 h-8 rounded-full bg-secondary-container/40 text-on-secondary-container flex items-center justify-center font-bold text-xs">
            EL
          </div>
          <div class="absolute bottom-1 left-1 px-1 rounded bg-black/60 text-[9px] text-white">
            Emma L.
          </div>
        </div>

        <!-- Student 3 -->
        <div class="w-28 h-full rounded-xl overflow-hidden bg-surface-container relative flex-shrink-0 border border-outline-variant">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop"
               alt="Lucas M."
               class="w-full h-full object-cover"/>
          <div class="absolute bottom-1 left-1 px-1 rounded bg-black/60 text-[9px] text-white">
            Lucas M.
          </div>
        </div>
      </div>

      <!-- RECENT CHAT PREVIEW PILL (TAP TO EXPAND CHAT SHEET) -->
      <button class="w-full px-3 py-2 rounded-xl bg-surface-container-high/90 border border-outline-variant/60 flex items-center gap-2 text-left shadow-sm active:bg-surface-container-highest">
        <span class="material-symbols-outlined text-secondary text-sm">chat</span>
        <div class="flex-1 truncate">
          <span class="text-[11px] font-semibold text-slate-300">Prof. Martin:</span>
          <span class="text-[11px] text-slate-400">Tout à fait Thomas ! Et avec un tas de Fibonacci...</span>
        </div>
        <span class="w-2 h-2 rounded-full bg-secondary"></span>
      </button>

    </div>

    <!-- BOTTOM THUMB-ZONE CONTROL BAR -->
    <div class="px-5 py-4 bg-surface-container border-t border-outline-variant flex items-center justify-between z-20">
      <!-- Mute Mic -->
      <button class="w-12 h-12 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center text-white active:scale-95 shadow">
        <span class="material-symbols-outlined text-xl text-emerald-400">mic</span>
      </button>

      <!-- Video Cam -->
      <button class="w-12 h-12 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center text-white active:scale-95 shadow">
        <span class="material-symbols-outlined text-xl text-emerald-400">videocam</span>
      </button>

      <!-- Raise Hand -->
      <button class="w-12 h-12 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center text-white active:scale-95 shadow">
        <span class="material-symbols-outlined text-xl text-amber-400">front_hand</span>
      </button>

      <!-- Chat / More Sheets -->
      <button class="w-12 h-12 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center text-white active:scale-95 shadow relative">
        <span class="material-symbols-outlined text-xl text-secondary">chat</span>
        <span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-secondary"></span>
      </button>

      <!-- Leave Call (Red) -->
      <button class="w-12 h-12 rounded-full bg-red-600 flex items-center justify-center text-white active:scale-95 shadow-lg">
        <span class="material-symbols-outlined text-xl">call_end</span>
      </button>
    </div>

    <!-- BOTTOM SAFE AREA BAR -->
    <div class="h-6 flex items-center justify-center bg-surface-container">
      <div class="w-32 h-1 rounded-full bg-slate-600"></div>
    </div>

  </div>

</body>
</html>
