name: smartclass
description: "SmartClass - Plateforme intelligente et collaborative d'apprentissage"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Localization
  intl: ^0.20.2

  # UI Components
  cupertino_icons: ^1.0.8

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  collection: ^1.18.0

  # Storage
  shared_preferences: ^2.2.3

  # Network (ready for backend)
  dio: ^5.4.3+1
  # retrofit: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/