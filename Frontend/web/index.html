  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">

  <!-- SmartClass Web Anti-Fraud Face Detection via MediaPipe Tasks Vision -->
  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    let faceLandmarker = null;
    let isInitializing = false;

    async function initFaceLandmarker() {
      if (faceLandmarker || isInitializing) return;
      isInitializing = true;
      try {
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          outputFaceBlendshapes: true,
          runningMode: "VIDEO",
          numFaces: 4
        });
        window._smartclassFaceDetectorReady = true;
      } catch (err) {
        console.warn("[AntiFraud] MediaPipe initialization error:", err);
      } finally {
        isInitializing = false;
      }
    }

    // Expose detector to Flutter Web
    window._smartclassDetectFace = function(videoElement) {
      if (!faceLandmarker || !videoElement || videoElement.videoWidth === 0) {
        return { faceCount: 1, gazeOffScreen: false, ready: !!faceLandmarker };
      }
      try {
        const nowInMs = performance.now();
        const results = faceLandmarker.detectForVideo(videoElement, nowInMs);
        const count = results.faceLandmarks ? results.faceLandmarks.length : 0;
        
        let gazeOff = false;
        if (count === 1) {
          // 1. Vérification de l'orientation de la tête (Head Pose via Landmarks)
          // Repères clés : Bout du nez (1), Oreille gauche (234), Oreille droite (454)
          if (results.faceLandmarks && results.faceLandmarks[0]) {
            const landmarks = results.faceLandmarks[0];
            const nose = landmarks[1];
            const leftEar = landmarks[234];
            const rightEar = landmarks[454];

            if (nose && leftEar && rightEar) {
              const earDist = Math.abs(rightEar.x - leftEar.x);
              if (earDist > 0.05) {
                // Ratio de position du nez entre l'oreille gauche et l'oreille droite
                // Centré = ~0.5. Si tourne à gauche ou droite, s'écarte de 0.5
                const noseRatio = (nose.x - leftEar.x) / (rightEar.x - leftEar.x);
                if (noseRatio < 0.30 || noseRatio > 0.70) {
                  gazeOff = true; // Tête tournée sur les côtés
                }
              }
            }
          }

          // 2. Vérification des mouvements des yeux (Blendshapes)
          if (!gazeOff && results.faceBlendshapes && results.faceBlendshapes[0]) {
            const shapes = results.faceBlendshapes[0].categories;
            const lookLeft = shapes.find(s => s.categoryName === 'eyeLookOutLeft')?.score || 0;
            const lookRight = shapes.find(s => s.categoryName === 'eyeLookOutRight')?.score || 0;
            const lookInLeft = shapes.find(s => s.categoryName === 'eyeLookInLeft')?.score || 0;
            const lookInRight = shapes.find(s => s.categoryName === 'eyeLookInRight')?.score || 0;
            const lookDown = shapes.find(s => s.categoryName === 'eyeLookDownLeft')?.score || 0;

            // Détection stricte : regard latéral ou vers le bas
            if (lookLeft > 0.35 || lookRight > 0.35 || lookInLeft > 0.35 || lookInRight > 0.35 || lookDown > 0.50) {
              gazeOff = true;
            }
          }
        }
        return { faceCount: count, gazeOffScreen: gazeOff, ready: true };
      } catch (e) {
        return { faceCount: 1, gazeOffScreen: false, ready: true, error: e.toString() };
      }
    };

    window._smartclassInitDetector = initFaceLandmarker;
    // Auto-init on page load
    initFaceLandmarker();
  </script>
</head>
<body>

</body>
