services:
  db:
    image: pgvector/pgvector:pg17
    container_name: smartclass-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartclass_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-smartclass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartclass} -d ${POSTGRES_DB:-smartclass}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: smartclass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  searxng:
    image: searxng/searxng:latest
    container_name: smartclass-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: smartclass-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-192.168.100.107}
    environment:
      - NODE_IP=${LIVEKIT_NODE_IP:-192.168.100.107}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  egress:
    image: livekit/egress:latest
    container_name: smartclass-egress
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml:ro
      - ${STORAGE_HOST_PATH:-C:/SmartClassStorage}:/var/lib/smartclass-storage
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy

  asr:
    build:
      context: ./asr
    container_name: smartclass-asr
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./asr/models:/app/models
      - ./asr/main.py:/app/main.py
      - asr_cache:/root/.cache/huggingface
    environment:
      - ASR_MODEL_SIZE=${ASR_MODEL_SIZE:-tiny}
      - ASR_DEVICE=${ASR_DEVICE:-auto}
      - ASR_COMPUTE_TYPE=${ASR_COMPUTE_TYPE:-auto}

  api:
    build:
      context: .
      target: dev
    container_name: smartclass-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ${STORAGE_HOST_PATH:-C:/SmartClassStorage}:/var/lib/smartclass-storage
    environment:
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_ROOT=${STORAGE_LOCAL_ROOT:-/var/lib/smartclass-storage}
      - ASR_BASE_URL=${ASR_BASE_URL:-http://asr:8000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      searxng:
        condition: service_started
    command: >
      sh -c "(which ffmpeg >/dev/null 2>&1 || (apt-get update -y && apt-get install -y ffmpeg fonts-dejavu-core)) && mkdir -p /var/lib/smartclass-storage/recordings && chmod -R 2775 /var/lib/smartclass-storage && npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  asr_cache:
